<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Scoring Tool</title>
<script>try{var t=localStorage.getItem('kpi-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: one column of cards under a brand tab strip; summary tiles first, entry table next, charts after. */
:root {
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6d6b66;
  --line: #e1e0d9; --axis: #c3c2b7; --series: #2a78d6; --series-soft: #9ec5f4; --series2: #eb6834; --hover: #f0efec;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --zone0: #f3e9e8; --zone1: #f6f0e4; --zone2: #eef3ea; --zone3: #e4f0e8;
  --h0: #cde2fb; --h1: #9ec5f4; --h2: #2a78d6; --h3: #1c5cab; --h4: #0d366b; --t0: #0b0b0b; --t1: #0b0b0b; --t2: #fff; --t3: #fff; --t4: #fff;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --focus: #2a78d6;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a19f98;
    --line: #2c2c2a; --axis: #383835; --series: #3987e5; --series-soft: #1c5cab; --series2: #d95926; --hover: #232321; --focus: #6da7ec;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --zone0: #2a2020; --zone1: #2a2619; --zone2: #1f261c; --zone3: #17261d;
    --h0: #1f2a3a; --h1: #184f95; --h2: #256abf; --h3: #5598e7; --h4: #9ec5f4; --t0: #f0efec; --t1: #fff; --t2: #fff; --t3: #0b0b0b; --t4: #0b0b0b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a19f98;
  --line: #2c2c2a; --axis: #383835; --series: #3987e5; --series-soft: #1c5cab; --series2: #d95926; --hover: #232321; --focus: #6da7ec;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --zone0: #2a2020; --zone1: #2a2619; --zone2: #1f261c; --zone3: #17261d;
  --h0: #1f2a3a; --h1: #184f95; --h2: #256abf; --h3: #5598e7; --h4: #9ec5f4; --t0: #f0efec; --t1: #fff; --t2: #fff; --t3: #0b0b0b; --t4: #0b0b0b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
h1, h2, p { margin: 0; }
h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 650; text-wrap: balance; }
.page { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
.lede { color: var(--ink2); margin-top: 4px; max-width: 62ch; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.inline { flex-direction: row; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
.field.inline label { align-self: flex-start; width: 100%; }
label { font-size: 12px; color: var(--ink2); }
input[type=text], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 8px; min-height: 34px; }
select { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn { font: inherit; font-weight: 550; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 12px; min-height: 34px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--series); border-color: var(--series); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.save { font-size: 12px; color: var(--muted); align-self: center; min-height: 34px; display: inline-flex; align-items: center; }
.save-error, .save-slow { color: var(--crit); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-weight: 600; color: var(--ink2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--series); }
.tab-n { font-size: 12px; font-weight: 400; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.tile-label { font-size: 12px; color: var(--ink2); }
.tile-value { font-size: 28px; font-weight: 650; line-height: 1.15; letter-spacing: -0.01em; }
.tile-sub { font-size: 12px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.card-head p, .card-note { color: var(--ink2); max-width: 78ch; }
.card-note { margin: 8px 0 12px; }
details.card > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.card[open] > summary::before { transform: rotate(90deg); }
.inline-h { display: inline; }

.table-scroll { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.grid thead th { font-size: 12px; font-weight: 600; color: var(--ink2); white-space: nowrap; vertical-align: bottom; }
table.grid tbody tr:last-child th, table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover { background: var(--hover); }
table.grid .r { text-align: right; }
table.grid th.name { font-weight: 550; white-space: nowrap; }
.th-sub { font-weight: 400; color: var(--muted); font-size: 11px; }
.num-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
.strong { font-weight: 650; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.pct-wrap { position: relative; display: inline-block; }
input.num { width: 92px; text-align: right; padding-right: 22px; font-variant-numeric: tabular-nums; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; min-height: 34px; padding-top: 6px; padding-bottom: 6px; padding-left: 8px; }
input.num:disabled { opacity: .6; }
.unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.warn-input input.num { border-color: var(--crit); }
.grade-cell { display: flex; align-items: center; gap: 8px; }
select.grade { min-height: 30px; padding: 3px 6px; font-size: 13px; }
.tier { min-width: 40px; font-weight: 600; }
.note-warn { font-size: 12px; color: var(--ink2); margin-top: 2px; }
.note-warn::before { content: "\25B2  "; color: var(--warn); }
.cell-foot { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 4px; }
.grade-chip { font-size: 11px; color: var(--muted); }
.grade-chip.reduced { color: var(--ink2); font-weight: 600; }
.pts-small { font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; }
table.wide input.num { width: 84px; }

.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); }
.muted-pill { color: var(--muted); padding-left: 10px; font-weight: 400; }
.ico { font-size: 11px; line-height: 1; }
.ico.good { color: var(--good); } .ico.warn { color: var(--warn); } .ico.serious { color: var(--serious); } .ico.crit { color: var(--crit); }

.rank { position: relative; display: flex; flex-direction: column; gap: 4px; }
.rank-head { display: grid; grid-template-columns: 150px 1fr 84px; gap: 12px; font-size: 12px; color: var(--muted); }
.rank-axis { position: relative; height: 16px; }
.pass-tag { position: absolute; transform: translateX(-50%); white-space: nowrap; color: var(--ink2); }
.rank-row { display: grid; grid-template-columns: 150px 1fr 84px; gap: 12px; align-items: center; padding: 3px 0; border-radius: 6px; }
.rank-row:hover, .rank-row:focus-visible { background: var(--hover); }
.rank-name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-track { position: relative; height: 18px; border-left: 1px solid var(--axis); }
.rank-bar { position: absolute; left: 0; top: 4px; height: 10px; background: var(--series); border-radius: 0 4px 4px 0; }
.rank-bar.partial { background: var(--series-soft); }
.rank-pass { position: absolute; top: -2px; bottom: -2px; border-left: 1px dashed var(--ink2); }
.rank-val { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip { position: fixed; z-index: 10; width: 236px; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); pointer-events: none; font-size: 12px; }
.tip-title { font-weight: 650; margin-bottom: 6px; }
.tip-row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink2); padding: 1px 0; }

.earn { display: flex; align-items: center; gap: 10px; }
.earn-track { flex: 1; min-width: 80px; max-width: 280px; height: 10px; background: var(--hover); border-radius: 0 4px 4px 0; position: relative; overflow: hidden; }
.earn-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series); border-radius: 0 4px 4px 0; }
.earn-val { font-size: 12px; color: var(--ink2); min-width: 92px; }
.empty { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; max-width: 90ch; }


.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; margin-bottom: 12px; }
.toolbar-note { color: var(--muted); font-size: 12px; align-self: center; }
.rank-row.clickable { cursor: pointer; padding-left: 4px; padding-right: 4px; margin: 0 -4px; }
.rank-row.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--series); }
.rank-row.sel .rank-name { font-weight: 700; }
.heat { border-collapse: separate; border-spacing: 2px; width: 100%; font-variant-numeric: tabular-nums; }
.heat th, .heat td { padding: 0; }
.heat thead th { font-size: 11px; font-weight: 600; color: var(--ink2); padding: 4px 2px; text-align: center; vertical-align: bottom; }
.heat thead th:first-child { text-align: left; padding-left: 8px; }
.heat th.name { text-align: left; white-space: nowrap; padding-right: 8px; }
.heat tr.sel th.name .link { font-weight: 700; }
.link { font: inherit; font-weight: 550; color: var(--ink); background: none; border: 0; padding: 6px 8px; cursor: pointer; text-align: left; border-radius: 6px; }
.link:hover { background: var(--hover); }
.hc { text-align: center; min-width: 66px; }
.hcell { display: block; width: 100%; min-height: 34px; border: 0; border-radius: 4px; font: inherit; font-weight: 600; font-size: 12px; cursor: pointer; }
.hcell.empty-cell { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--axis); color: var(--muted); font-weight: 400; cursor: default; }
.heat tr.sel .hcell { outline: 2px solid var(--ink2); outline-offset: -2px; }
.bin0 { background: var(--h0); color: var(--t0); } .bin1 { background: var(--h1); color: var(--t1); } .bin2 { background: var(--h2); color: var(--t2); }
.bin3 { background: var(--h3); color: var(--t3); } .bin4 { background: var(--h4); color: var(--t4); }
.hover-total { font-weight: 650; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink2); }
.legend-title { color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.line-swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-bottom: 8px; }
.detail h3 { margin: 0; font-size: 18px; }
.detail-sub { color: var(--ink2); font-size: 12px; }
.detail-score { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.big { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.avg-tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.detail-table .earn-track { overflow: visible; }
.whatif { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.whatif-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.whatif-head label { font-size: 13px; color: var(--ink); }
.whatif-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.whatif input[type=range] { width: 100%; max-width: 520px; accent-color: var(--series); }
.whatif-out { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.whatif-out .strong { color: var(--ink); }
svg.trend { width: 100%; max-width: 720px; height: auto; display: block; }

.seg-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--hover); border-radius: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.seg-tab { font: inherit; font-weight: 550; color: var(--ink2); background: none; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.seg-tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.legend-btns { margin: 0 0 10px; }
.legend-btn { font: inherit; font-size: 12px; color: var(--ink2); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend-btn:hover { background: var(--hover); }
.legend-btn.on { border-color: var(--ink2); color: var(--ink); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack-row { display: grid; grid-template-columns: 150px 1fr 84px; gap: 12px; align-items: center; }
.stack-track { position: relative; display: flex; height: 20px; background: var(--hover); border-radius: 0 4px 4px 0; border-left: 1px solid var(--axis); }
.seg { height: 100%; border-right: 2px solid var(--surface); transition: opacity .15s; min-width: 0; }
.seg:last-of-type { border-right: 0; }
.pass-mark { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed var(--ink); pointer-events: none; }
.stack-axis { display: grid; grid-template-columns: 150px 1fr 84px; gap: 12px; font-size: 11px; color: var(--muted); }
.stack-ticks { position: relative; height: 14px; }
.stack-ticks span { position: absolute; transform: translateX(-50%); }
.chart-note { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 80ch; }
svg.dots { width: 100%; max-width: 720px; height: auto; display: block; }
.cols { display: flex; gap: 8px; min-width: 760px; }
.cols-y { display: flex; flex-direction: column; justify-content: space-between; height: 240px; font-size: 11px; color: var(--muted); text-align: right; padding-top: 0; width: 38px; }
.cols-plot { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; background-position: 0 0; border-bottom: 1px solid var(--axis); height: 240px; position: relative; }
.cols-group { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; position: relative; height: 240px; }
.cols-bars { height: 240px; display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 0 6px; }
.cbar-wrap { position: relative; width: 38%; max-width: 54px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
.cbar { display: block; border-radius: 4px 4px 0 0; min-height: 1px; }
.cbar-val { font-size: 10px; text-align: center; color: var(--ink2); padding-bottom: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 -10px; }
.cbar-empty { color: var(--muted); }
.cols-label { position: absolute; top: 100%; left: 0; right: 0; padding-top: 6px; font-size: 11px; text-align: center; color: var(--ink2); line-height: 1.2; }
.cols { padding-bottom: 38px; padding-top: 22px; }

.brandline { display: flex; align-items: center; gap: 14px; }
.logo { display: block; width: auto; max-width: 180px; object-fit: contain; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.login-card .logo { align-self: center; }
.login-title { font-size: 22px; text-align: center; }
.login-sub { color: var(--ink2); text-align: center; }
.login-card input[type=text], .login-card input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 8px 10px; min-height: 38px; }
.login-error { color: var(--crit); font-size: 13px; }
.login-btn { width: 100%; min-height: 40px; }

.theme-switch { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 12px; color: var(--ink2); background: none; border: 0; padding: 4px 2px; cursor: pointer; min-height: 34px; }
.theme-switch.corner { position: fixed; top: 12px; right: 16px; }
.ts-track { width: 34px; height: 20px; border-radius: 999px; background: var(--axis); position: relative; transition: background .15s; flex: none; }
.ts-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s; }
.theme-switch[aria-checked="true"] .ts-track { background: var(--series); }
.theme-switch[aria-checked="true"] .ts-thumb { transform: translateX(14px); }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; }
.topright { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--series); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 650; font-size: 13px; flex: none; }
.who-name { font-weight: 600; color: var(--ink); }
.toolbar-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.toolbar-row .save { margin-left: auto; min-height: 34px; display: inline-flex; align-items: center; }
.tile-value.small { font-size: 20px; line-height: 1.25; padding: 4px 0; }
.sort-btn { font: inherit; font-weight: 600; font-size: 12px; color: var(--ink2); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.sort-btn:hover { color: var(--ink); }
.sub-name { font-size: 11px; color: var(--muted); font-weight: 400; }
table.stats td, table.stats th { vertical-align: top; }
.mix-bar { display: flex; gap: 2px; margin-bottom: 14px; }
.mix-seg { padding: 8px 10px; font-size: 12px; font-weight: 650; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mix-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mix-col { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mix-head { font-weight: 650; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.mix-n { margin-left: auto; color: var(--ink2); font-variant-numeric: tabular-nums; }
.mix-item { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--line); font-size: 13px; }
.mix-none { color: var(--muted); font-size: 13px; }

@media (max-width: 640px) {
  .rank-head, .rank-row, .stack-row, .stack-axis { grid-template-columns: 96px 1fr 72px; gap: 8px; }
  .tile-value { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
